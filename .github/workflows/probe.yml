name: JRAページ構成の調査

on:
  workflow_dispatch:
    inputs:
      date:
        description: "対象日 YYYY-MM-DD"
        required: true
      kind:
        description: "調べるもの（all / result / site / check / past）"
        required: false
        default: "all"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - env:
          KEIBA_CONTACT: ${{ vars.KEIBA_CONTACT }}
          TARGET_DATE: ${{ inputs.date }}
        if: inputs.kind == 'all'
        run: python -m keiba.probe --date "$TARGET_DATE"
      - if: inputs.kind == 'all'
        run: python -m keiba.probe_baba
      - if: inputs.kind == 'site'
        env:
          TARGET_URL: ${{ inputs.date }}
        run: python -m keiba.probe_site "$TARGET_URL"
      - if: inputs.kind == 'check'
        env:
          KEIBA_CONTACT: ${{ vars.KEIBA_CONTACT }}
          PAGE_PASSWORD: ${{ secrets.PAGE_PASSWORD }}
          TARGET_DATE: ${{ inputs.date }}
        run: python -m keiba.check_day --date "$TARGET_DATE" --race "新潟-8"
      - if: inputs.kind == 'past'
        env:
          KEIBA_CONTACT: ${{ vars.KEIBA_CONTACT }}
        run: python -m keiba.probe_past
      - if: inputs.kind == 'result'
        env:
          KEIBA_CONTACT: ${{ vars.KEIBA_CONTACT }}
          TARGET_DATE: ${{ inputs.date }}
        run: python -m keiba.probe_result --date "$TARGET_DATE"
