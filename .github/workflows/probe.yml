name: JRAページ構成の調査

on:
  workflow_dispatch:
    inputs:
      date:
        description: "対象日 YYYY-MM-DD"
        required: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - env:
          KEIBA_CONTACT: ${{ vars.KEIBA_CONTACT }}
          TARGET_DATE: ${{ inputs.date }}
        run: python -m keiba.probe --date "$TARGET_DATE"
      - run: python -m keiba.probe_baba
